<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenQP Downloads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
<style>
:root {
  --bg: #f2f4f7; --paper: #ffffff; --ink: #18212b; --muted: #5a6774; --line: #dbe1e8;
  --accent: #2858a8; --accent-ink: #ffffff; --ok: #1d7548; --warn: #9a6200; --bad: #b0261d;
  --display: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f141a; --paper: #151c24; --ink: #e2e8ee; --muted: #9aa6b2; --line: #28323d;
          --accent: #86abff; --accent-ink: #0f141a; --ok: #4fc48c; --warn: #e2b04a; --bad: #f27a70; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15.5px; line-height: 1.55; }
.wrap { max-width: 640px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right)) 56px max(16px, env(safe-area-inset-left)); display: grid; gap: 18px; }
header { display: grid; gap: 4px; }
h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; line-height: 1.2; }
h1 { font-size: 34px; }
h2 { font-size: 22px; }
p { margin: 0; }
a { color: var(--accent); }
code { font-family: var(--mono); font-size: 0.9em; }
.who { color: var(--muted); font-size: 14px; min-height: 1.4em; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 14px; }
.stack { display: grid; gap: 8px; }
label { font-weight: 500; font-size: 14px; }
input[type=email], input:not([type]), textarea { font: inherit; color: inherit; background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; width: 100%; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
.check input { margin-top: 4px; }
button { font: inherit; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
button.link { border: 0; padding: 0; background: none; color: var(--accent); text-decoration: underline; }
button:disabled { opacity: 0.5; cursor: wait; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.or { text-align: center; color: var(--muted); font-size: 13px; }
.hint { font-size: 14px; }
.hint.ok, .msg.ok { color: var(--ok); }
.hint.warn { color: var(--warn); }
.msg.bad { color: var(--bad); }
.msg { font-size: 14px; }
.fine { color: var(--muted); font-size: 13px; }
.files { display: grid; gap: 8px; }
.file { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; }
.file .name { font-family: var(--mono); font-size: 13.5px; overflow-wrap: anywhere; }
.file .size { color: var(--muted); font-size: 13px; }
.dl { font-weight: 500; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
footer { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>OpenQP Downloads</h1>
    <p class="who" id="who"></p>
  </header>
  <main id="view"><div class="card"><p>Loading…</p></div></main>
  <footer>OpenQP is distributed under the <a href="https://github.com/Open-Quantum-Platform/openqp-releases/blob/main/LICENSE" target="_blank" rel="noopener">OpenQP Research License 1.0</a>. Use by or for a company needs a separate commercial licence.</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
